            <div class="dropdown-head"><b data-auth-name>Admin</b><div class="fs-xs text-muted" data-auth-email></div></div>

<div class="dash">
  <aside class="side"></aside>

  

  <main class="dash-main">

    <div class="dash-head">
      <div class="flex gap-2 center">
        <div>
          <h1><svg class="ic" aria-hidden="true"><use href="#i-sliders"></use></svg> Payment settings</h1>
          <p>Every way a customer can add money, and every setting behind it, on one page.</p>
        </div>
      </div>
      <div class="flex gap-2 wrap">
        <button class="btn btn-ghost btn-sm" id="refresh" aria-label="Refresh"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-refresh"></use></svg> Refresh</button>
      </div>
    </div>

    <div class="grid g-4 mb-3" id="mini">
      <div class="card card-pad"><div class="sk sk-line" style="width:50%"></div><div class="sk sk-title"></div></div>
      <div class="card card-pad"><div class="sk sk-line" style="width:50%"></div><div class="sk sk-title"></div></div>
      <div class="card card-pad"><div class="sk sk-line" style="width:50%"></div><div class="sk sk-title"></div></div>

          <h3 class="mb-0"><svg class="ic" aria-hidden="true"><use href="#i-sliders"></use></svg> Common settings</h3>
          <span id="sharedVerdict"></span>
        </div>
        <div class="card-body">
          <div id="sharedForm">
            <div class="sk sk-line" style="width:70%"></div>
            <div class="sk sk-line" style="width:90%"></div>
          </div>
          <div class="pm-foot">
            <span></span>
            <button class="btn btn-primary btn-sm" type="button" id="sharedSave"><span class="btn-txt"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-save"></use></svg> Save</span></button>
          </div>
        </div>
      </div>

      <div class="card card-pad">
        <div class="card-head" style="padding:0 0 12px">
          <h3 class="mb-0"><svg class="ic" aria-hidden="true"><use href="#i-history"></use></svg> Latest deposits</h3>
        </div>
        <div id="activity"></div>
      </div>
